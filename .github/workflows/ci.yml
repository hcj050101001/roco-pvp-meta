name: CI

# 只做校验，不会部署。推送到 main 之后，更新 GitHub Pages 需要手动运行
# workflow_dispatch：「Build and deploy Pages」。普通 push 不会自动发布。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh:guard
        env:
          REFRESH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run research:validate
        env:
          REFRESH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: ./.github/actions/validate-site
      - name: Remind manual Pages deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "校验已通过。推送到 main 不会自动发布。"
          echo "需要更新线上页面时，请在 Actions 中手动运行 workflow_dispatch：「Build and deploy Pages」。"
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
