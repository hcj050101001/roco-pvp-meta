name: Research refresh and deploy
on:
  schedule:
    - cron: '0 0 1,16 * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      scope:
        description: '研究范围（默认同时扩展当季与历史赛季）'
        type: choice
        required: true
        default: all
        options:
          - all
          - current
          - history
permissions:
  contents: read
concurrency:
  group: research-refresh
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check DeepSeek credential availability
        env:
          HAS_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo '::error::DEEPSEEK_API_KEY is missing. Existing Pages content is unchanged.'
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run refresh:snapshot
      - run: npm run season:check
      - name: Discover current and historical lineups across platforms
        env:
          RESEARCH_SCOPE: ${{ inputs.scope || 'all' }}
        run: npm run research:full -- --scope "$RESEARCH_SCOPE" --seeds research/expansion-seeds.json
      - run: npm run research:validate
      - name: Report source and season coverage before research
        run: npm run research:coverage
      - name: Prepare bounded vision inputs
        run: npm run research:vision
      - name: Preserve collector evidence before model execution
        uses: actions/upload-artifact@v4
        with:
          name: collected-evidence
          path: research/inbox/
          retention-days: 7
      - name: Research with DeepSeek
        uses: openai/codex-action@v1
        timeout-minutes: 120
        with:
          # The action proxies Bearer authentication to this third-party endpoint.
          openai-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          responses-api-endpoint: https://api.deepseek.com/responses
          model: deepseek-flash
          effort: max
          allow-bot-users: github-actions[bot]
          codex-version: 0.163.0
          codex-args: >-
            ["-c", "model_catalog_json=\"${{ github.workspace }}/.github/codex/deepseek-models.json\"",
             "-c", "web_search=\"disabled\""]
          prompt-file: .github/codex/refresh.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          output-file: research/codex-output.md
      - name: Record actual source coverage after verification
        run: npm run research:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-evidence
          path: research/
          include-hidden-files: false
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: proposed-content
          path: |
            data/
            public/assets/lineups/
          retention-days: 7
  validate-and-publish:
    needs: research
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: proposed-content
          path: .refresh-content
      - uses: actions/download-artifact@v4
        with:
          name: research-evidence
          path: research
      - uses: actions/download-artifact@v4
        with:
          name: collected-evidence
          path: research/inbox
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/validate/promote.ts
      - run: npm run refresh:guard
        env:
          REFRESH_BASE_SHA: ${{ github.sha }}
      - run: npm run research:record
      - run: npm run research:coverage
      - id: changed
        run: npm run publish:plan
      - if: steps.changed.outputs.publish == 'true'
        uses: ./.github/actions/validate-site
        with:
          evidence-name: research-ui-evidence
      - name: Commit verified content
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data public/assets/lineups research/runs research/candidates research/rejected
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh verified lineup evidence'
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.changed.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.changed.outputs.publish == 'true'
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        if: steps.changed.outputs.publish == 'true'
        id: deployment
