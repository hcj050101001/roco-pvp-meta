name: Check current season
on:
  schedule:
    - cron: '17 8 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  season:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run season:check
      - id: changed
        run: npm run publish:plan
      - if: steps.changed.outputs.publish == 'true'
        uses: ./.github/actions/validate-site
        with:
          evidence-name: season-ui-evidence
      - if: steps.changed.outputs.publish == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/update-state.json data/seasons.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: verify official season and preserve transition lineups'
            git push
          fi
      - if: steps.changed.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - if: steps.changed.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: steps.changed.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
        id: deployment
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-evidence
          path: research/runs/season-*
          retention-days: 14
      - name: Start major season research when credentials are configured
        if: steps.changed.outputs.major == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" == "true" ]; then
            gh workflow run refresh-and-deploy.yml
          else
            echo 'Major season detected. Previous teams stay available until AI research credentials are configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
