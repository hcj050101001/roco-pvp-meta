name: Check current season
on:
  schedule:
    - cron: '17 8 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  season:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run season:check
      - id: changed
        run: |
          if ! git diff --quiet -- data/update-state.json data/seasons.json; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
          node --input-type=module -e "import fs from 'node:fs';import {execFileSync} from 'node:child_process';const old=JSON.parse(execFileSync('git',['show','HEAD:data/update-state.json'],{encoding:'utf8'}));const next=JSON.parse(fs.readFileSync('data/update-state.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'major='+String(old.season!==next.season)+'\\n');"
      - if: steps.changed.outputs.publish == 'true'
        run: npm run check && npm test && npm run build
      - if: steps.changed.outputs.publish == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.changed.outputs.publish == 'true'
        run: npm run test:ui
        env:
          TEST_BASE: /roco-pvp-meta
      - if: steps.changed.outputs.publish == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/update-state.json data/seasons.json
          git commit -m 'chore: verify official season and preserve transition lineups'
          git push
      - if: steps.changed.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - if: steps.changed.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: steps.changed.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
        id: deployment
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-evidence
          path: research/runs/season-*
          retention-days: 14
      - name: Start major season research when credentials are configured
        if: steps.changed.outputs.major == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" == "true" ]; then
            gh workflow run refresh-and-deploy.yml
          else
            echo 'Major season detected. Previous teams stay available until AI research credentials are configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
