services:
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - builder

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  builder:
    build: .
    environment:
      SITE_URL: ${SITE_URL:-http://127.0.0.1}
      SITE_BASE: ${SITE_BASE:-}
    volumes:
      - ./data:/app/data:ro
      - ./public:/app/public:ro
      - ./deploy/site:/app/deploy/site
    command: ['sh', 'scripts/server/deploy-atomic.sh']

  collector:
    build: .
    profiles: ['collector']
    environment:
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      RESEARCH_CHROMIUM_PATH: /usr/bin/chromium
    volumes:
      - ./data:/app/data
      - ./public:/app/public
      - ./research:/app/research
    depends_on:
      - searxng
    command: ['sh', 'scripts/server/collect-latest.sh']

volumes:
  caddy_data:
  caddy_config:
